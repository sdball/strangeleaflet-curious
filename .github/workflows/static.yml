# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # check the pages and upload public/; deploying is a separate job, so the upload has
  # settled by the time the deploy looks for it
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check every page has GoatCounter
        run: |
          missing=$(grep -rL --include='*.html' 'data-goatcounter="https://sdball.goatcounter.com/count"' public || true)
          if [ -n "$missing" ]; then
            echo "::error::These pages are missing the GoatCounter snippet:"
            echo "$missing"
            exit 1
          fi
          # the snippet counts once someone interacts, so count.js mustn't on load
          counting=$(grep -rL --include='*.html' 'no_onload: true' public || true)
          if [ -n "$counting" ]; then
            echo "::error::These pages are missing no_onload: true in window.goatcounter, so they'd count bots and count people twice:"
            echo "$counting"
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

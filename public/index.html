<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Cabinet of Curios — Strange Leaflet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #DDE5DC;        /* pale celadon, like old museum glass */
  --ink: #1F2A44;       /* navy ink */
  --muted: #55607A;
  --tag: #F6F1DF;       /* tag card stock */
  --brass: #9A6F1E;
  --string: #8C7A5B;
  --line: #B9C4B8;
  --console: #F6F1DF;
  --serif: "Young Serif", Georgia, "Times New Roman", serif;
  --mono: "Courier Prime", "Courier New", ui-monospace, monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14222B; --ink: #E8E2CC; --muted: #A6AE9F; --tag: #1E3240;
    --brass: #D6A84A; --string: #7E7158; --line: #2C4352; --console: #0F1A21;
  }
}

:root[data-theme="dark"] {
  --bg: #14222B; --ink: #E8E2CC; --muted: #A6AE9F; --tag: #1E3240;
  --brass: #D6A84A; --string: #7E7158; --line: #2C4352; --console: #0F1A21;
}

*, *::before, *::after { box-sizing: inherit; }

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}

body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--serif); line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}

.wrap {
  max-width: 960px;
  margin: 0 auto;
  padding: 2.5rem 1.25rem 4rem;
}

header {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.75rem;
}

h1 {
  font-weight: 400;
  font-size: clamp(2.1rem, 7vw, 3.4rem);
  line-height: 1.05;
  margin: 0;
  letter-spacing: -0.01em;
}

.sub {
  font-family: var(--mono);
  color: var(--muted);
  margin: .4rem 0 0;
  font-size: .95rem;
}

.sub a { color: inherit; }

.toggle {
  font: inherit; font-family: var(--mono); font-size: 1rem;
  min-height: 44px; padding: .5rem 1rem; border-radius: 6px;
  border: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer;
}

.toggle[aria-pressed="true"] {
  background: var(--ink);
  color: var(--bg);
}

button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 3px solid var(--brass);
  outline-offset: 2px;
}

/* Text interface */
.console {
  background: var(--console); border: 1.5px solid var(--ink); border-radius: 8px;
  font-family: var(--mono); margin-bottom: 2rem; overflow: hidden;
}

.console[hidden] { display: none; }

.log {
  max-height: 16rem;
  overflow-y: auto;
  padding: 1rem 1rem .25rem;
  font-size: 1rem;
}
.log p {
  margin: 0 0 .75rem;
  white-space: pre-wrap;
}
.log .cmd {
  color: var(--brass);
  font-weight: 700;
}

.prompt {
  display: flex;
  align-items: center;
  gap: .5rem;
  padding: .5rem 1rem;
  border-top: 1px dashed var(--line);
}
.prompt span {
  color: var(--brass);
  font-weight: 700;
}
.prompt input {
  flex: 1;
  min-width: 0;
  font: inherit;
  font-size: 16px; /* 16px stops iOS zooming on focus */
  color: var(--ink);
  background: transparent;
  border: 0;
  padding: .6rem 0;
}
.prompt input:focus-visible { outline: none; }
.prompt button {
  font: inherit;
  font-size: .95rem;
  min-height: 44px;
  padding: 0 .9rem;
  border-radius: 6px;
  background: var(--ink);
  color: var(--bg);
  border: 0;
  cursor: pointer;
}

.chips {
  display: flex;
  gap: .5rem;
  overflow-x: auto;
  padding: .25rem 1rem 1rem;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  font: inherit;
  font-size: .95rem;
  min-height: 40px;
  padding: 0 .85rem;
  border-radius: 999px;
  border: 1.5px solid var(--line);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}
.chip.verb { border-color: var(--brass); }

/* Filters */
.filters {
  display: flex;
  gap: .5rem;
  margin-bottom: 1.25rem;
  font-family: var(--mono);
}
.filters button {
  font: inherit;
  min-height: 40px;
  padding: 0 .9rem;
  border-radius: 999px;
  cursor: pointer;
  border: 1.5px solid var(--line);
  background: transparent;
  color: var(--ink);
}
.filters button[aria-pressed="true"] {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--bg);
}

/* Curio tags */
.shelf {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr));
  gap: 2.25rem 1.5rem;
}

.tag {
  position: relative;
  display: block;
  text-decoration: none;
  color: inherit;
  /* The tag itself is the ink "border": its ::after is the card stock, inset
     by the border width and clipped along a parallel cut so the clipped
     corners keep a 1.5px edge too. Corner cuts are 40px x 22px. */
  background: var(--ink);
  border-radius: 4px;
  clip-path: polygon(40px 0, calc(100% - 40px) 0, 100% 22px, 100% 100%, 0 100%, 0 22px);
  isolation: isolate;
  padding: 2.4rem 1.2rem 1.2rem; min-height: 100%;
  transform: rotate(var(--tilt, 0deg));
  transform-origin: 50% 0;
  transition: transform .25s ease;
}
.tag::after { /* card stock */
  content: "";
  position: absolute;
  inset: 1.5px;
  z-index: -1;
  background: var(--tag);
  border-radius: 2.5px;
  /* the outer cut's diagonal offset inward by 1.5px, in this box's coordinates */
  clip-path: polygon(38.9px 0, calc(100% - 38.9px) 0, 100% 21.4px, 100% 100%, 0 100%, 0 21.4px);
}
.tag::before { /* eyelet */
  content: "";
  position: absolute;
  top: .8rem;
  left: 50%;
  width: 14px;
  height: 14px;
  margin-left: -7px;
  border-radius: 50%;
  border: 3px solid var(--brass);
  background: var(--bg);
}
.tag:hover { transform: rotate(0deg); }
.tag .meta {
  font-family: var(--mono);
  font-size: .85rem;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
}
.tag h2 {
  font-weight: 400;
  font-size: 1.35rem;
  line-height: 1.2;
  margin: .35rem 0 .5rem;
}
.tag p {
  margin: 0;
  font-size: .98rem;
  color: var(--muted);
}

.slot {
  position: relative;
  padding-top: 1.1rem;
}
.slot::before { /* string */
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  width: 1.5px;
  height: 1.9rem;
  background: var(--string);
  z-index: 1;
}


.toast {
  position: fixed;
  left: 50%;
  bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  font-family: var(--mono);
  padding: .7rem 1rem;
  border-radius: 6px;
  max-width: calc(100% - 2rem);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
.toast.show { opacity: 1; }

footer {
  margin-top: 3rem;
  font-family: var(--mono);
  color: var(--muted);
  font-size: .9rem;
}

.flicker { animation: flicker 1.1s ease-out; }
/* drop-shadow follows the tag's clipped outline, so apply it to the unclipped parent */
@keyframes flicker {
  0%   { filter: drop-shadow(0 0 0 transparent); }
  12%  { filter: drop-shadow(0 0 16px var(--brass)); }
  22%  { filter: drop-shadow(0 0 3px var(--brass)); }
  34%  { filter: drop-shadow(0 0 12px var(--brass)); }
  100% { filter: drop-shadow(0 0 0 transparent); }
}
@media (prefers-reduced-motion: reduce) {
  .tag, .toast { transition: none; }
  .flicker { animation: none; }
}
</style>
<script>
  window.goatcounter = {
    path: function(p) { return location.host + p }
  }
</script>
<script data-goatcounter="https://sdball.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>The Cabinet of Curios</h1>
      <p class="sub">Exhibits, toys, guides, and weird things! From <a href="https://strangeleaflet.com">Strange Leaflet</a></p>
    </div>
    <button class="toggle" id="toggle" aria-pressed="false" aria-controls="console">&gt; Text Adventure Interface</button>
  </header>

  <section class="console" id="console" hidden aria-label="Text interface">
    <div class="log" id="log" aria-live="polite"></div>
    <div class="prompt">
      <span aria-hidden="true">&gt;</span>
      <input id="cmd" type="text" aria-label="Command"
             autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
             enterkeyhint="go" placeholder="look, examine wave, help">
      <button id="run" type="button">Go</button>
    </div>
    <div class="chips" id="chips" aria-label="Command shortcuts"></div>
  </section>

  <nav class="filters" aria-label="Filter">
    <button data-kind="all" aria-pressed="true">All</button>
    <button data-kind="exhibit" aria-pressed="false">Exhibits</button>
    <button data-kind="toy" aria-pressed="false">Toys</button>
    <button data-kind="guide" aria-pressed="false">Guides</button>
  </nav>

  <ul class="shelf" id="shelf"></ul>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// when true link navigation is simulated
const DEMO = false;
// pretend the visitor arrived with no browser history, to show the placard.
const SIMULATE_DIRECT_ARRIVAL = false;

const CURIOS = [
  { id: "wave", name: "Behringer Wave Guide", kind: "guide", href: "behringer-wave/",
    blurb: "A practical walkthrough of the Wave's wavetable engine, with patch notes.",
    words: ["wave", "behringer"] },
  { id: "bits", name: "Bitfield Explorer", kind: "exhibit", href: "bitfield-explorer/",
    blurb: "Flip switches and read the bits as numbers, text, floats, colors, and dates.",
    words: ["bitfield", "explorer"] },
  { id: "minifloat", name: "Minifloat Ruler", kind: "exhibit", href: "minifloat-ruler/",
    blurb: "Every number an 8-bit float can hold, on one ruler. Watch the gaps double.",
    words: ["minifloat", "ruler"] },
  { id: "pocket-places", name: "Pocket Places", kind: "toy", href: "pocket-places/",
    blurb: "A chill animated pixel art diorama with custom decorations.",
    words: ["pocket", "places"] },
  { id: "lehmer", name: "Lehmer Codes", kind: "exhibit", href: "lehmer-codes/",
    blurb: "Turn any order of up to five cards into a short code, then turn the code back into the order.",
    words: ["lehmer", "codes"] },
  { id: "odometers", name: "Odometers", kind: "exhibit", href: "odometers/",
    blurb: "Explore how number bases work: base-10, base-2, clock, and factorial base.",
    words: ["odometers", "odometer"] },
  { id: "morse", name: "Morse Code", kind: "exhibit", href: "morse-code/",
    blurb: "Type a message and hear it in Morse, or tap the key and watch your dots and dashes become letters.",
    words: ["morse", "telegraph"] },
  { id: "complex", name: "Complex Numbers", kind: "exhibit", href: "complex-numbers/",
    blurb: "Multiply by i and the plane turns a quarter turn. Drag points to watch lengths multiply, angles add, and axes rotate.",
    words: ["complex", "imaginary", "rotation"] },
  { id: "exploring-e", name: "Exploring e", kind: "exhibit", href: "exploring-e/",
    blurb: "Grow 1 in smaller and smaller pieces and it settles on 2.71828…. Push sideways and it walks round a circle.",
    words: ["euler", "exponential"] },
];

const $ = (id) => document.getElementById(id);
const shelf = $("shelf"),
  log = $("log"),
  input = $("cmd"),
  chips = $("chips"),
  toast = $("toast");

// ---------- Shelf ----------

function renderShelf(kind = "all") {
  shelf.innerHTML = "";
  CURIOS.forEach((c, i) => {
    if (kind !== "all" && c.kind !== kind) return;
    const tilt = [-1.6, 1.2, -0.8, 1.8][i % 4];
    const li = document.createElement("li");
    li.className = "slot";
    li.innerHTML = `
      <a class="tag" href="${c.href}" data-id="${c.id}" style="--tilt:${tilt}deg">
        <span class="meta">
          <span>No. ${i + 1}</span>
          <span>${c.kind}</span>
        </span>
        <h2>${c.name}</h2>
        <p>${c.blurb}</p>
      </a>`;
    shelf.appendChild(li);
  });
}

document.querySelectorAll(".filters button").forEach((b) => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".filters button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    renderShelf(b.dataset.kind);
  });
});

shelf.addEventListener("click", (e) => {
  const a = e.target.closest("a.tag");
  if (a) { e.preventDefault(); visit(CURIOS.find((c) => c.id === a.dataset.id)); }
});

function visit(c) {
  if (DEMO) { showToast(`Would open ${c.href}`); return; }
  location.href = c.href;
}

let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
}

// ---------- Text interface (get lamp) ----------

// state
let cabinetOpen = false;

// consts
const BLOG_URL = "https://strangeleaflet.com";

const LEAFLET = `WELCOME TO THE CABINET OF CURIOS!

This room holds the exhibits, toys, guides, and assorted oddments of Strange Leaflet. Each curio hangs from a paper tag. Examine one to read its tag, or get one to try it out.`;

const CAN_GO_BACK = history.length > 1 && !(DEMO && SIMULATE_DIRECT_ARRIVAL);

const PLACARD = "The placard reads: \"You arrived here by some direct means that this exit cannot provide. Unfortunately, you'll have to leave the way you came.\"";

const EXITS = "\nA doorway to the east opens into the reading room. " + (CAN_GO_BACK
  ? "The way out is west."
  : "There is an exit sign to the west, but curiously the wall beneath it is blank except for a small placard.");

// no three word parser here but still
const VERBS = {
  look: ["look", "l"],
  examine: ["examine", "x", "read", "inspect"],
  get: ["get", "take", "grab", "use", "play"],
  open: ["open"],
  close: ["close"],
  go: ["go", "walk", "enter", "head"],
  leave: ["leave", "exit", "out", "quit", "west", "w"],
  east: ["east", "e"],
  drop: ["drop"],
  help: ["help", "?", "h"],
  inventory: ["inventory", "i", "inv"],
};

const verbOf = (w) => Object.keys(VERBS).find((k) => VERBS[k].includes(w));

const isLeaflet = (nouns) => nouns.includes("leaflet");

const OUT_WORDS = ["out", "outside", "back", "west", "w", "exit"];

const BLOG_WORDS = ["east", "e", "blog", "reading", "room", "doorway", "door", "study"];

function say(text, cls) {
  const p = document.createElement("p");
  if (cls) p.className = cls;
  p.textContent = text;
  log.appendChild(p);
  log.scrollTop = log.scrollHeight;
}

function findCurio(words) {
  const q = words.join(" ");
  if (!q) return null;
  return CURIOS.find((c) =>
    c.name.toLowerCase().includes(q) || c.id === q || c.words.some((w) => words.includes(w)));
}

function flicker(el) {
  if (!el) return;
  el.classList.remove("flicker"); void el.offsetWidth; el.classList.add("flicker");
  el.addEventListener("animationend", () => el.classList.remove("flicker"), { once: true });
}

function frotz(targets) {
  if (!targets.length) return say("What do you want to frotz?");
  if (targets.length > 1) return say("You can only frotz one thing at a time.");

  const fade = "flickers with a brief, warm light, then fades. The magic here seems thin.";

  if (isLeaflet(targets)) {
    return say("The strange leaflet " + fade);
  }

  if (targets.includes("cabinet")) {
    flicker(shelf);
    return say("The entire cabinet " + fade);
  }

  if (["me", "myself", "self"].some((w) => targets.includes(w))) {
    flicker(consoleEl);
    return say("You " + fade.replace("flickers", "flicker").replace("fades", "fade"));
  }

  if (!CAN_GO_BACK && targets.includes("placard")) {
    return say("The placard " + fade + " Its message is unchanged.");
  }

  const c = findCurio(targets);
  if (c) {
    flicker(shelf.querySelector(`a.tag[data-id="${c.id}"]`)?.closest(".slot"));
    return say(`The ${c.name} ` + fade);
  }

  return say(`You don't see any "${targets.join(" ")}" to frotz.`);
}

function goBlog() {
  say("You step through the doorway into the reading room.");
  if (DEMO) return showToast(`Would open ${BLOG_URL}`);
  location.href = BLOG_URL;
}

function goOut() {
  if (CAN_GO_BACK) {
    say("You head back the way you came.");
    if (DEMO) return showToast("Would go back in your browser history");
    return history.back();
  }
  say("You walk up to the exit sign. There's no door beneath it, only a blank wall and a small placard.");
}

function run(raw) {
  const line = raw.trim().toLowerCase().replace(/\s+/g, " ");
  if (!line) return;
  say("> " + line, "cmd");
  const [first, ...rest] = line.split(" ");
  const nouns = rest.filter((w) => !["the", "a", "an", "at", "to", "on", "upon", "strange", "into", "through", "and"].includes(w));
  const verb = verbOf(first);

  if (first === "xyzzy" || first === "plugh") return say("You faintly hear, as though the deep in a cavern, a hollow voice say, \"Fool\".");

  if (first === "win") return say("Naturally! But there are no points here.");

  // FROTZ: the light spell from Enchanter and Sorcerer
  if (first === "frotz" || (first === "cast" && nouns[0] === "frotz")) {
    const targets = first === "cast" ? nouns.slice(1) : nouns;
    return frotz(targets);
  }

  // HTTP easter eggs: "GET /behringer-wave/" and friends
  if (rest[0] && rest[0].startsWith("/")) {
    const norm = (p) => "/" + p.replace(/^\/+|\/+$/g, "") + (p.replace(/\//g, "") ? "/" : "");
    const path = norm(rest[0]);
    if (first === "get") {
      if (path === "/") return say("200 OK. You're already standing in front of the cabinet.");
      const c = CURIOS.find((x) => norm(x.href) === path);
      if (!c) return say(`404 Not Found. The cabinet has no curio labeled ${path}.`);
      if (c && !cabinetOpen) return say(`You see ${path} in the cabinet but it is closed!`);
      say(`200 OK. You take the ${c.name}.`); return visit(c);
    }
    if (["post", "put", "patch"].includes(first)) return say("405 Method Not Allowed. The cabinet does not accept donations.");
    if (first === "delete") return say("403 Forbidden. The curios are staying right where they are.");
    if (first === "head") return say("200 OK. The cabinet seems to nod politely.");
  }

  switch (verb) {

    case "look":
      if (!cabinetOpen) return say("A tall glass-fronted cabinet stands against the wall. Each shelf holds curios that each have a paper tag tied to it. The doors are closed.\n" + EXITS);
      return say("The cabinet stands open. On its shelves:\n" + CURIOS.map((c) => "  • " + c.name).join("\n") + "\n" + EXITS);

    case "open": {
      if (isLeaflet(nouns)) return say(LEAFLET);
      if (!nouns.length || nouns.includes("cabinet") || nouns.includes("doors")) {
        if (cabinetOpen) return say("It's already open.");
        cabinetOpen = true; setChips();
        return say("The doors swing open with a dusty creak. Inside:\n" + CURIOS.map((c) => "  • " + c.name).join("\n"));
      }
      const c = findCurio(nouns);
      if (!c) return say(`There's no "${nouns.join(" ")}" in the cabinet.`);
      say(`You lift the ${c.name} off its shelf.`); return visit(c);
    }

    case "close": {
      if (!nouns.length || nouns.includes("cabinet") || nouns.includes("doors")) {
        if (cabinetOpen) {
          cabinetOpen = false;
          return say("You gently close the cabinet doors.")
        } else {
          return say("The cabinet doors are already closed.");
        }
      }
    }

    case "examine": {
      if (!nouns.length) return say("Examine what?");
      if (isLeaflet(nouns)) return say(LEAFLET);
      if (nouns.includes("curios")) {
        if (cabinetOpen) {
          return say("Inside the cabinet you can see shelves of curios. Some emiting sounds, some spiraling off curving graphs of equations, some glowing with pixels.");
        } else {
          return say("Behind the closed doors of the cabinet you can see shelves of curios; each fascinating in its own way.");
        }
      };
      if (nouns.includes("cabinet")) {
        if (cabinetOpen) {
          say("The cabinet is made of high quality polished wood with ornate carvings. Through its open doors you can see shelves of curios that each have a paper tag.");
        } else {
          say("The cabinet is made of high quality polished wood with ornate carvings. Through its glass doors you can see shelves of curios that each have a paper tag.");
        }
        return;
      };
      if (nouns.some((w) => ["paper", "tag", "tags"].includes(w))) {
        const c = findCurio(nouns);
        if(!c) return say("The paper tags are museum quality card stock with precisely handwritten lettering.");
        return say(`The tag reads: ${c.name}. ${c.blurb}\n(Try "get ${c.words[0]}".)`);
      }
      if (nouns.includes("placard")) return say(CAN_GO_BACK ? "You don't see any placard here." : PLACARD);
      if (nouns.includes("sign") || nouns.includes("exit")) return say(CAN_GO_BACK
        ? "A small sign glows over the west doorway. It reads EXIT."
        : "The sign glows a hopeful red and reads EXIT. Beneath it is a blank wall with a small placard.");
      if (nouns.includes("wall")) return say(CAN_GO_BACK ? "The walls are lined with shelves." : "The wall under the exit sign is perfectly blank, apart from a small placard.");
      if (nouns.some((w) => BLOG_WORDS.includes(w))) return say("Through the doorway you can see shelves of writing and a comfortable chair. Go east to enter.");
      const c = findCurio(nouns);
      if (!c) return say(`You don't see any "${nouns.join(" ")}" here.`);
      return say(`The tag reads: ${c.name}. ${c.blurb}\n(Try "get ${c.words[0]}".)`);
    }

    case "get": {
      if (isLeaflet(nouns)) return say("You already have it. Try reading it.");
      if (nouns.includes("out")) return goOut();
      const c = findCurio(nouns);
      if (!c) return say(nouns.length ? `There's no "${nouns.join(" ")}" here.` : "Get what?");
      if (c && !cabinetOpen) return say(`You can see ${c.name} in the cabinet but the doors are closed.`);
      say(`You pick up the ${c.name}.`); return visit(c);
    }

    case "go": {
      if (!nouns.length) return say("Go where?\n" + EXITS);
      if (nouns.some((w) => OUT_WORDS.includes(w))) return goOut();
      if (nouns.some((w) => BLOG_WORDS.includes(w))) return goBlog();
      const c = findCurio(nouns);
      if (c && cabinetOpen) { say(`You pick up the ${c.name}.`); return visit(c); }
      if (c) return say(`You can see ${c.name} in the cabinet but the doors are closed.`);
      return say("You can't go that way. " + EXITS);
    }

    case "leave":
      return goOut();

    case "east":
      return goBlog();

    case "drop":
      if (isLeaflet(nouns)) return say("You'd better hold onto it.");
      return say("You aren't holding that.");

    case "inventory":
      return say("You are carrying:\n  • a strange leaflet");

    case "help":
      return say("Try: look, read leaflet, open cabinet, examine <thing>, get <thing>, east, leave, inventory.\nShort forms work too: l, x, i, e, w.");

    default:
      return say(`I don't understand "${first}". Type help for ideas.`);
  }
}

// Chips: tap a verb, then tap a thing. No keyboard needed on a phone.
function setChips(pendingVerb) {
  chips.innerHTML = "";
  const add = (label, onTap, cls = "") => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip " + cls; b.textContent = label;
    b.addEventListener("click", onTap); chips.appendChild(b);
  };
  if (pendingVerb) {
    if (pendingVerb === "examine") {
      add("Strange leaflet", () => { run("read leaflet"); setChips(); });
      if (!CAN_GO_BACK) add("Placard", () => { run("read placard"); setChips(); });
    }
    CURIOS.forEach((c) => add(c.name, () => { run(`${pendingVerb} ${c.words[0]}`); setChips(); }));
    add("Cancel", () => setChips());
    return;
  }
  add("look", () => run("look"), "verb");
  if (!cabinetOpen) add("open cabinet", () => run("open cabinet"), "verb");
  add("examine…", () => setChips("examine"), "verb");
  add("get…", () => setChips("get"), "verb");
  add("go east", () => run("go east"), "verb");
  add("leave", () => run("leave"), "verb");
  add("inventory", () => run("inventory"), "verb");
  add("help", () => run("help"), "verb");
}

$("run").addEventListener("click", () => {
  run(input.value); input.value = "";
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    run(input.value);
    input.value = "";
  }
});

input.addEventListener("focus", () => {
  setTimeout(() => input.scrollIntoView({ block: "nearest" }), 300)
});

// Toggle, remembered per visitor
const toggle = $("toggle"), consoleEl = $("console");

function setConsole(on) {
  consoleEl.hidden = !on;
  toggle.setAttribute("aria-pressed", on);
  try { localStorage.setItem("textMode", on ? "1" : "0"); } catch (_) {}
  if (on && !log.childElementCount) run("look");
}

toggle.addEventListener("click", () => setConsole(consoleEl.hidden));

renderShelf();

setChips();

let saved = null;

try { saved = localStorage.getItem("textMode"); } catch (_) {}

if (saved === "1") setConsole(true);
</script>

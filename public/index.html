<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Cabinet of Curios — Strange Leaflet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏷️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #DDE5DC;        /* pale celadon, like old museum glass */
  --ink: #1F2A44;       /* navy ink */
  --muted: #55607A;
  --tag: #F6F1DF;       /* tag card stock */
  --brass: #9A6F1E;
  --string: #8C7A5B;
  --line: #B9C4B8;
  --hover: #EDE3C2;      /* a lamp over the room you point at */
  --serif: "Young Serif", Georgia, "Times New Roman", serif;
  --mono: "Courier Prime", "Courier New", ui-monospace, monospace;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14222B; --ink: #E8E2CC; --muted: #A6AE9F; --tag: #1E3240;
    --brass: #D6A84A; --string: #7E7158; --line: #2C4352;
    --hover: #2A3B3A;
  }
}

:root[data-theme="dark"] {
  --bg: #14222B; --ink: #E8E2CC; --muted: #A6AE9F; --tag: #1E3240;
  --brass: #D6A84A; --string: #7E7158; --line: #2C4352;
  --hover: #2A3B3A;
}

*, *::before, *::after { box-sizing: inherit; }

html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}

body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--serif); line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}

.wrap {
  max-width: 960px;
  margin: 0 auto;
  padding: 2.5rem 1.25rem 4rem;
}

header { margin-bottom: 1.75rem; }

h1 {
  font-weight: 400;
  font-size: clamp(2.1rem, 7vw, 3.4rem);
  line-height: 1.05;
  margin: 0;
  letter-spacing: -0.01em;
}

.sub {
  font-family: var(--mono);
  color: var(--muted);
  margin: .4rem 0 0;
  font-size: .95rem;
}

.sub a { color: inherit; }

button:focus-visible,
a:focus-visible {
  outline: 3px solid var(--brass);
  outline-offset: 2px;
}

/* Map: a visitor's floor plan. The walls are the ink showing through the
   gaps between rooms, and a doorway is a notch of floor laid over a wall. */
.map {
  --wall: 5px;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: minmax(9rem, auto) minmax(6rem, auto) minmax(6rem, auto);
  grid-template-areas:
    "mathematics     computer-science games"
    "sound-and-music hall             workshop"
    "sound-and-music hall             current-events";
  gap: var(--wall);
  padding: var(--wall);
  margin: 0 0 3.5rem;
  background: var(--ink);
  border-radius: 3px;
}

.room {
  --floor: var(--tag);
  position: relative;
  display: flex;
  flex-direction: column;
  gap: .15rem;
  padding: .75rem .9rem .9rem;
  background: var(--floor);
  color: inherit;
  text-decoration: none;
}
a.room:hover { --floor: var(--hover); }
a.room:focus-visible { outline-offset: -7px; }

.room .no {
  font-family: var(--mono);
  font-size: .8rem;
  color: var(--muted);
}
.room .name {
  font-size: 1.2rem;
  line-height: 1.2;
}

/* one display case per curio, numbered like the tags */
.cases {
  display: flex;
  flex-wrap: wrap;
  gap: .3rem;
  margin-top: auto;
  padding-top: .6rem;
}
.case {
  display: grid;
  place-items: center;
  width: 1.6rem;
  height: 1.6rem;
  border: 1.5px solid var(--ink);
  border-radius: 2px;
  font-family: var(--mono);
  font-size: .75rem;
}
a.room:hover .case {
  border-color: var(--brass);
  color: var(--brass);
}

.hall {
  --floor: var(--bg);
  align-items: center;
  justify-content: center;
  text-align: center;
}
.hall .here {
  font-family: var(--mono);
  font-size: .85rem;
  color: var(--brass);
}
.hall .here::before { /* the "you are here" pin */
  content: "";
  display: inline-block;
  width: .7rem;
  height: .7rem;
  margin-right: .4rem;
  border-radius: 50%;
  background: var(--brass);
  vertical-align: -.05rem;
}

.room::after {
  content: "";
  position: absolute;
  background: var(--floor);
}
@media (min-width: 641px) {
  .room[data-door="b"]::after { left: calc(50% - 1.4rem); bottom: calc(-1 * var(--wall)); width: 2.8rem; height: var(--wall); }
  .room[data-door="r"]::after { top: calc(50% - 1.4rem); right: calc(-1 * var(--wall)); width: var(--wall); height: 2.8rem; }
  .room[data-door="l"]::after { top: calc(50% - 1.4rem); left: calc(-1 * var(--wall)); width: var(--wall); height: 2.8rem; }
}

/* on a phone the plan folds into two columns with the hall along the bottom */
@media (max-width: 640px) {
  .map {
    --wall: 4px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: none;
    grid-auto-rows: minmax(7rem, auto);
    grid-template-areas:
      "mathematics     computer-science"
      "games           sound-and-music"
      "workshop        current-events"
      "hall            hall";
  }
  .hall { min-height: 5rem; }
  .room[data-door-sm="b"]::after { left: calc(50% - 1.2rem); bottom: calc(-1 * var(--wall)); width: 2.4rem; height: var(--wall); }
  .room[data-door-sm="r"]::after { top: calc(50% - 1.2rem); right: calc(-1 * var(--wall)); width: var(--wall); height: 2.4rem; }
}

/* Galleries */
.gallery { margin-top: 3.5rem; }
.gallery-head {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  justify-content: space-between;
  gap: .25rem 1rem;
  margin-bottom: 1rem;
  padding-bottom: .75rem;
  border-bottom: 1.5px solid var(--line);
}
.gallery-head .no {
  margin: 0;
  font-family: var(--mono);
  font-size: .85rem;
  color: var(--muted);
}
.gallery-head h2 {
  margin: 0;
  font-weight: 400;
  font-size: clamp(1.6rem, 5vw, 2.1rem);
  line-height: 1.15;
}
.gallery-head .note {
  margin: .3rem 0 0;
  color: var(--muted);
  max-width: 60ch;
}
.to-map {
  display: inline-flex;
  align-items: center;
  min-height: 40px;
  font-family: var(--mono);
  font-size: .9rem;
  color: var(--muted);
}

/* Curio tags */
.shelf {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr));
  gap: 2.25rem 1.5rem;
}

.tag {
  position: relative;
  display: block;
  text-decoration: none;
  color: inherit;
  /* The tag itself is the ink "border": its ::after is the card stock, inset
     by the border width and clipped along a parallel cut so the clipped
     corners keep a 1.5px edge too. Corner cuts are 40px x 22px. */
  background: var(--ink);
  border-radius: 4px;
  clip-path: polygon(40px 0, calc(100% - 40px) 0, 100% 22px, 100% 100%, 0 100%, 0 22px);
  isolation: isolate;
  padding: 2.4rem 1.2rem 1.2rem; min-height: 100%;
  transform: rotate(var(--tilt, 0deg));
  transform-origin: 50% 0;
  transition: transform .25s ease;
}
.tag::after { /* card stock */
  content: "";
  position: absolute;
  inset: 1.5px;
  z-index: -1;
  background: var(--tag);
  border-radius: 2.5px;
  /* the outer cut's diagonal offset inward by 1.5px, in this box's coordinates */
  clip-path: polygon(38.9px 0, calc(100% - 38.9px) 0, 100% 21.4px, 100% 100%, 0 100%, 0 21.4px);
}
.tag::before { /* eyelet */
  content: "";
  position: absolute;
  top: .8rem;
  left: 50%;
  width: 14px;
  height: 14px;
  margin-left: -7px;
  border-radius: 50%;
  border: 3px solid var(--brass);
  background: var(--bg);
}
.tag:hover { transform: rotate(0deg); }
.tag .meta {
  font-family: var(--mono);
  font-size: .85rem;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
}
.tag h3 {
  font-weight: 400;
  font-size: 1.35rem;
  line-height: 1.2;
  margin: .35rem 0 .5rem;
}
.tag p {
  margin: 0;
  font-size: .98rem;
  color: var(--muted);
}

.slot {
  position: relative;
  padding-top: 1.1rem;
}
.slot::before { /* string */
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  width: 1.5px;
  height: 1.9rem;
  background: var(--string);
  z-index: 1;
}

footer {
  margin-top: 3rem;
  font-family: var(--mono);
  color: var(--muted);
  font-size: .9rem;
}

@media (prefers-reduced-motion: reduce) {
  .tag { transition: none; }
}
</style>
<script>
  // Count the page once someone moves a pointer, touches, wheels, or types.
  // Scrapers run pages in a real Chrome, so GoatCounter can't tell them from
  // people, but they load a page and leave without doing any of that.
  // Not scroll, since a page can scroll itself.
  window.goatcounter = {
    no_onload: true,
    path: function(p) { return location.host + p }
  }
  ;(function() {
    var events = ["pointermove", "pointerdown", "touchstart", "wheel", "keydown"]
    function count() { if (window.goatcounter.count) window.goatcounter.count() }
    function human() {
      events.forEach(function(type) { removeEventListener(type, human, true) })
      if (window.goatcounter.count || document.readyState === "complete") count()
      else addEventListener("load", count, { once: true })
    }
    events.forEach(function(type) { addEventListener(type, human, { capture: true, passive: true }) })
  })()
</script>
<script data-goatcounter="https://sdball.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Cabinet of Curios</h1>
    <p class="sub">Exhibits, toys, guides, gadgets, and weird things! From <a href="https://strangeleaflet.com">Strange Leaflet</a> by Stephen Ball (and Claude)</p>
  </header>

  <nav class="map" id="map" aria-label="Museum map"></nav>

  <div id="galleries"></div>
</div>

<script>
// The galleries, in visiting order. Each curio names its room. Doors say which
// wall a room's doorway is in on the wide plan and on a phone's.
const ROOMS = [
  { id: "mathematics", name: "Mathematics", doors: ["r", "r"],
    note: "Bases, codes, turns, and sequences to drag, count, and spin." },
  { id: "computer-science", name: "Computer Science", doors: ["b", "b"],
    note: "How a computer keeps numbers, text, and whole games in bits." },
  { id: "games", name: "Games", doors: ["l", "b"],
    note: "Pilot a mech or a submarine, climb a word ladder, or play out a game of Go." },
  { id: "sound-and-music", name: "Sound and Music", doors: ["r", "b"],
    note: "Synths, sound effects, and Morse to play and take apart." },
  { id: "workshop", name: "The Workshop", doors: ["l", "b"],
    note: "Draw pixel art and arrange a little world of your own." },
  { id: "current-events", name: "Current Events", doors: ["l", "b"],
    note: "Live feeds from newsrooms and cockpits, typed out as they arrive." },
];

const CURIOS = [
  { id: "wave", name: "Behringer Wave Guide", kind: "guide", room: "sound-and-music", href: "behringer-wave/",
    blurb: "A practical walkthrough of the Wave's wavetable engine, with patch notes." },
  { id: "bits", name: "Bitfield Explorer", kind: "exhibit", room: "computer-science", href: "bitfield-explorer/",
    blurb: "Flip switches and read the bits as numbers, text, floats, colors, and dates." },
  { id: "minifloat", name: "Minifloat Ruler", kind: "exhibit", room: "computer-science", href: "minifloat-ruler/",
    blurb: "Every number an 8-bit float can hold, on one ruler. Watch the gaps double." },
  { id: "pocket-places", name: "Pocket Places", kind: "toy", room: "workshop", href: "pocket-places/",
    blurb: "A chill animated pixel art diorama with custom decorations." },
  { id: "lehmer", name: "Lehmer Codes", kind: "exhibit", room: "mathematics", href: "lehmer-codes/",
    blurb: "Turn any order of up to five cards into a short code, then turn the code back into the order." },
  { id: "odometers", name: "Odometers", kind: "exhibit", room: "mathematics", href: "odometers/",
    blurb: "Explore how number bases work: base-10, base-2, clock, and factorial base." },
  { id: "morse", name: "Morse Code", kind: "exhibit", room: "sound-and-music", href: "morse-code/",
    blurb: "Type a message and hear it in Morse, or tap the key and watch your dots and dashes become letters." },
  { id: "complex", name: "Complex Numbers", kind: "exhibit", room: "mathematics", href: "complex-numbers/",
    blurb: "Multiply by i and the plane turns a quarter turn. Drag points to watch lengths multiply, angles add, and axes rotate." },
  { id: "exploring-e", name: "Exploring e", kind: "exhibit", room: "mathematics", href: "exploring-e/",
    blurb: "Grow 1 in smaller and smaller pieces and it settles on 2.71828…. Push sideways and it walks round a circle." },
  { id: "lucas", name: "Fibonacci and Lucas Sequences", kind: "exhibit", room: "mathematics", href: "lucas-sequences/",
    blurb: "Add the last two numbers to get the next and watch the ratio settle on φ. Turn two dials to find Pell, Mersenne, and sequences that go in circles." },
  { id: "circles", name: "Circles and Triangles", kind: "exhibit", room: "mathematics", href: "circles-and-triangles/",
    blurb: "Turn a triangle inside a circle and watch sine, cosine, and tangent grow and shrink, then unroll the circle into a wave." },
  { id: "chyron-wire", name: "Chyron Wire", kind: "gadget", room: "current-events", href: "chyron-wire/",
    blurb: "TV news chyrons from CNN, Fox News, MS NOW and BBC News type themselves out a few minutes after they air." },
  { id: "hardpoint", name: "Hardpoint", kind: "toy", room: "games", href: "hardpoint/",
    blurb: "Pilot one mech against a squad of hostiles on a random hex battlefield. Take cover, watch your heat, and brace for the big hits." },
  { id: "sound-bench", name: "Sound Bench", kind: "exhibit", room: "sound-and-music", href: "sound-bench/",
    blurb: "Build game sound effects out of tones and noise, then retune the ones in Hardpoint or make your own." },
  { id: "conway-life", name: "Conway's Game of Life", kind: "exhibit", room: "games", href: "conway-life/",
    blurb: "Place stones on a Go board and watch four rules decide which live, die, and are born. Then set gliders and guns loose." },
  { id: "go-move-37", name: "Go and Move 37", kind: "exhibit", room: "games", href: "go-and-move-37/",
    blurb: "Capture stones, fight a ko, and count a finished game of Go. Then replay the AlphaGo move that stunned the world's best players." },
  { id: "claude-verbs", name: "Claude Verbs", kind: "gadget", room: "computer-science", href: "claude-verbs/",
    blurb: "Pick playlists of themed spinner verbs for Claude Code, preview them in a mock spinner, and copy one command that writes them in." },
  { id: "cozy-submarine", name: "Cozy Submarine", kind: "toy", room: "games", href: "cozy-submarine/",
    blurb: "Pilot a little submarine from sunny shallows down to the black smokers, and see what swims by." },
  { id: "custom-submarine", name: "Custom Submarine", kind: "gadget", room: "workshop", href: "custom-submarine/",
    blurb: "Draw your own submarine a pixel at a time, then sail it in Cozy Submarine." },
  { id: "pixel-bench", name: "Pixel Bench", kind: "exhibit", room: "workshop", href: "pixel-bench/",
    blurb: "See how a few dozen pixels become a dolphin or a glowing anglerfish, then redraw the ones in Cozy Submarine and Pocket Places or draw your own." },
  { id: "z-machine", name: "Z-Machine", kind: "exhibit", room: "computer-science", href: "z-machine/",
    blurb: "Open an Infocom-style story file and see how its rooms, words, and packed text are laid out." },
  { id: "z-machine-interpreter", name: "Z-Machine Interpreter", kind: "gadget", room: "computer-science", href: "z-machine-interpreter/",
    blurb: "Play Infocom-style story files: a small game written for the cabinet, Zork I to III, or one of your own." },
  { id: "not-a-number", name: "Not a Number", kind: "exhibit", room: "computer-science", href: "not-a-number/",
    blurb: "NaN isn't one value. Map all 2,046 of the 16-bit ones, then take one apart bit by bit." },
  { id: "air-to-ground", name: "Air to Ground", kind: "gadget", room: "current-events", href: "air-to-ground/",
    blurb: "Airline crews and their dispatchers trade messages over ACARS, typed out on an air traffic console as ACARS Drama posts them." },
  { id: "synth-music", name: "Synth Music", kind: "exhibit", room: "sound-and-music", href: "synth-music/",
    blurb: "Build a four-chord loop, take it apart into drums, bass, chords, arpeggio, and lead, then play it as synthwave, chiptune, italo, or ambient." },
  { id: "departures", name: "Departures", kind: "toy", room: "games", href: "departures/",
    blurb: "Turn one flap at a time to get from word to word on a railway departure board. Every stop has to be a word." },
];

const $ = (id) => document.getElementById(id);

// ---------- Map and galleries ----------

// tags are numbered gallery by gallery, so the numbers on the map's cases
// match the tags below
const numbered = ROOMS.flatMap((room) => CURIOS.filter((c) => c.room === room.id));
const no = new Map(numbered.map((c, i) => [c, i + 1]));

function renderMap() {
  const rooms = ROOMS.map((room, i) => {
    const here = CURIOS.filter((c) => c.room === room.id);
    return `
      <a class="room" href="#${room.id}" style="grid-area: ${room.id}"
         data-door="${room.doors[0]}" data-door-sm="${room.doors[1]}"
         aria-label="Gallery ${i + 1}, ${room.name}: ${here.length} curios">
        <span class="no">Gallery ${i + 1}</span>
        <span class="name">${room.name}</span>
        <span class="cases" aria-hidden="true">${here.map((c) => `<span class="case">${no.get(c)}</span>`).join("")}</span>
      </a>`;
  });
  $("map").innerHTML = rooms.join("") + `
    <div class="room hall" style="grid-area: hall" data-door="b" data-door-sm="b">
      <span class="name">Great Hall</span>
      <span class="here">You are here</span>
    </div>`;
}

function renderGalleries() {
  $("galleries").innerHTML = ROOMS.map((room, i) => `
    <section class="gallery" id="${room.id}" aria-labelledby="g-${room.id}">
      <div class="gallery-head">
        <div>
          <p class="no">Gallery ${i + 1}</p>
          <h2 id="g-${room.id}">${room.name}</h2>
          <p class="note">${room.note}</p>
        </div>
        <a class="to-map" href="#map">Back to the map</a>
      </div>
      <ul class="shelf">${CURIOS.filter((c) => c.room === room.id).map(tag).join("")}</ul>
    </section>`).join("");
}

function tag(c) {
  const n = no.get(c);
  const tilt = [-1.6, 1.2, -0.8, 1.8][n % 4];
  return `
    <li class="slot">
      <a class="tag" href="${c.href}" style="--tilt:${tilt}deg">
        <span class="meta">
          <span>No. ${n}</span>
          <span>${c.kind}</span>
        </span>
        <h3>${c.name}</h3>
        <p>${c.blurb}</p>
      </a>
    </li>`;
}

renderMap();
renderGalleries();
</script>
</body>
</html>
